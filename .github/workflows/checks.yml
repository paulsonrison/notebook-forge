name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_package.py
      - run: python skills/notebook-forge/scripts/render_notebook.py examples/learning-notebook.json --output build/demo.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-demo-${{ matrix.os }}-${{ matrix.python }}
          path: build/demo.pdf
