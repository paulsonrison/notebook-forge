name: Publish version release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [plugin.json, .github/workflows/release.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_package.py
      - run: python skills/notebook-forge/scripts/verify_gifs.py examples/animated-demo
      - run: python skills/notebook-forge/scripts/check_readability.py examples/animated-demo/notebook.pdf
      - run: python skills/notebook-forge/scripts/verify_media.py examples/illustrated-demo
      - run: python skills/notebook-forge/scripts/check_readability.py examples/illustrated-demo/notebook.pdf
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/*.zip
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: dist
      - name: Publish new version after verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("plugin.json"))["version"])')
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "v$version" "dist/notebook-forge-$version.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Notebook Forge v$version - Illustrated learning notes" \
            --notes-file "docs/releases/v$version.md"
